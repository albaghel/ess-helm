synapse:
  additional:
    user-directory:
      config: |
        user_directory:
          enabled: true
          search_all_users: true

matrixAuthenticationService:
  additional:
    keycloak-oidc.yaml:
      config: |
        upstream_oauth2:
          providers:
            - id: 01KXJ8ZM9E87X35NYNF0YA1MB0
              issuer: https://keycloak.ess.localhost/realms/matrix
              human_name: SSO
              client_id: mas
              client_secret: "kW4bn67CljoECI54F12rXyXJxvwFItxm"
              token_endpoint_auth_method: client_secret_post
              scope: "openid profile email"
              claims_imports:
                subject:
                  template: "{{ user.sub }}"
                localpart:
                  action: suggest
                  template: "{{ user.preferred_username }}"
                displayname:
                  action: suggest
                  template: "{{ user.name }}"
                email:
                  action: suggest
                  template: "{{ user.email }}"

  extraVolumes:
    - name: mas-ca-bundle
      configMap:
        name: mas-ca-bundle

  extraVolumeMounts:
    - name: mas-ca-bundle
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: ca-certificates.crt
      readOnly: true